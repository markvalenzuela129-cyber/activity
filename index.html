
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 100px 20px;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 4px 15px #ccd2e0;
    }

    h1 { color: #4338ca; }

    button {
      background: #4338ca;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>This is my first frontend project.</p>
    <button onclick="welcome()">Click Me</button>
    <p id="message"></p>
  </div>

  <script>
    function welcome() {
      document.getElementById("message").textContent =
        "Hello! Thanks for visiting my website.";
    }
  </script>
</body>
</html>
